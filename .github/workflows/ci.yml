name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: pytest
      - name: Smoke test on the sample DEM
        run: |
          tar -xzf data/dem/sample/rasters_COP30_sample.tar.gz -C data/dem/sample/
          cheminee plan data/dem/sample/output_hh.asc --objective score
          cheminee export data/dem/sample/output_hh.asc --out /tmp/flight.json
          python -c "import json, jsonschema; jsonschema.validate(json.load(open('/tmp/flight.json')), json.load(open('schema/flight-package.v1.schema.json')))"
